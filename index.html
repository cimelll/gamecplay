<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Arial Rounded MT Bold", "Varela Round", sans-serif;
            font-weight: bold;
        }
        body {
            background: linear-gradient(180deg, #E6F0FA 0%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            color: #1E40AF;
        }
        h1 {
            font-size: 42px;
            color: #1E40AF;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .container {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15);
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            border: 2px solid #BFDBFE;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            color: #1E40AF;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #3B82F6; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #3B82F6;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 12px;
        }
        button:hover { background: #2563EB; }
        button.secondary {
            background: #EFF6FF;
            color: #1E40AF;
        }
        button.secondary:hover { background: #DBEAFE; }
        .room-code {
            font-size: 26px;
            letter-spacing: 6px;
            color: #1E40AF;
            background: #EFF6FF;
            padding: 12px 24px;
            border-radius: 10px;
            margin: 16px 0;
        }
        .status {
            font-size: 20px;
            color: #1E40AF;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 24px auto;
            max-width: 300px;
        }
        .cell {
            aspect-ratio: 1;
            background: #EFF6FF;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #1E40AF;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .cell:hover { background: #DBEAFE; }
        .cell.x { color: #1E40AF; }
        .cell.o { color: #1D4ED8; background: #DBEAFE; }
        .cell.win { background: #BFDBFE; }
        .info {
            font-size: 15px;
            color: #3B82F6;
            margin-top: 10px;
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
        }
        .score {
            font-size: 18px;
            color: #1E40AF;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>XOX</h1>
    <div class="container">

        <!-- Layar Mulai -->
        <div id="startScreen" class="screen active">
            <button onclick="createRoom()">BUAT RUANGAN</button>
            <input type="text" id="joinCode" placeholder="MASUKKAN KODE RUANGAN">
            <button class="secondary" onclick="joinRoom()">MASUK KE RUANGAN</button>
        </div>

        <!-- Layar Ruangan -->
        <div id="roomScreen" class="screen">
            <div class="status" id="roomStatus">Kode Ruangan:</div>
            <div class="room-code" id="displayCode"></div>
            <div class="info" id="waitingInfo">Menunggu pemain lain...</div>
            <button class="secondary" onclick="backToStart()" style="margin-top:20px;">KEMBALI</button>
        </div>

        <!-- Layar Game -->
        <div id="gameScreen" class="screen">
            <div class="score-board">
                <div class="score">Pemain X: <span id="scoreX">0</span></div>
                <div class="score">Pemain O: <span id="scoreO">0</span></div>
            </div>
            <div class="status" id="turnStatus">Giliran Pemain X</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button onclick="resetBoard()">ULANGI PERMAINAN</button>
            <button class="secondary" onclick="backToStart()">KELUAR</button>
        </div>

    </div>

    <script>
        // Catatan: Ini versi simulasi lokal — untuk main antar HP butuh server
        // Untuk demo: buka 2 tab/jendela browser, masukkan kode yang sama
        let roomCode = '';
        let mySymbol = '';
        let board = ['','','','','','','','',''];
        let currentTurn = 'X';
        let gameActive = false;
        let scoreX = 0, scoreO = 0;

        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNPQRSTUVWXYZ123456789';
            let code = '';
            for(let i=0; i<5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function createRoom() {
            roomCode = generateCode();
            document.getElementById('displayCode').textContent = roomCode;
            document.getElementById('waitingInfo').textContent = 'Siapkan perangkat kedua, masukkan kode ini';
            showScreen('roomScreen');
            mySymbol = 'X';
            simulateRoomJoin();
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.trim().toUpperCase();
            if(code.length < 4) { alert('Masukkan kode yang valid'); return; }
            roomCode = code;
            document.getElementById('displayCode').textContent = roomCode;
            document.getElementById('waitingInfo').textContent = 'Bergabung sebagai Pemain O';
            showScreen('roomScreen');
            mySymbol = 'O';
            setTimeout(() => startGame(), 800);
        }

        // Simulasi koneksi antar pemain (demo)
        function simulateRoomJoin() {
            const checkInterval = setInterval(() => {
                const saved = localStorage.getItem('xox_room_' + roomCode);
                if(saved === 'joined') {
                    clearInterval(checkInterval);
                    setTimeout(() => startGame(), 500);
                }
            }, 500);
        }

        function startGame() {
            showScreen('gameScreen');
            gameActive = true;
            updateStatus();
        }

        function backToStart() {
            gameActive = false;
            board = ['','','','','','','','',''];
            roomCode = '';
            localStorage.clear();
            showScreen('startScreen');
        }

        // Klik kotak
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                if(!gameActive) return;
                const idx = parseInt(cell.dataset.index);
                if(board[idx] !== '') return;
                if((currentTurn === 'X' && mySymbol !== 'X') || 
                   (currentTurn === 'O' && mySymbol !== 'O')) return;

                board[idx] = currentTurn;
                cell.textContent = currentTurn;
                cell.classList.add(currentTurn.toLowerCase());
                checkWinner();
                switchTurn();
            });
        });

        function switchTurn() {
            currentTurn = currentTurn === 'X' ? 'O' : 'X';
            updateStatus();
        }

        function updateStatus() {
            const statusEl = document.getElementById('turnStatus');
            if(currentTurn === mySymbol) {
                statusEl.textContent = 'GILIRAN ANDA (' + mySymbol + ')';
            } else {
                statusEl.textContent = 'MENUNGGU LAWAN...';
            }
        }

        function checkWinner() {
            for(let p of winPatterns) {
                const [a,b,c] = p;
                if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    highlightWin(p);
                    setTimeout(() => {
                        alert('PEMAIN ' + board[a] + ' MENANG!');
                        if(board[a] === 'X') scoreX++; else scoreO++;
                        updateScore();
                        resetBoard();
                    }, 400);
                    return;
                }
            }
            if(!board.includes('')) {
                gameActive = false;
                setTimeout(() => {
                    alert('SERI!');
                    resetBoard();
                }, 400);
            }
        }

        function highlightWin(pattern) {
            pattern.forEach(i => {
                document.querySelectorAll('.cell')[i].classList.add('win');
            });
        }

        function resetBoard() {
            board = ['','','','','','','','',''];
            gameActive = true;
            currentTurn = 'X';
            document.querySelectorAll('.cell').forEach(c => {
                c.textContent = '';
                c.classList.remove('x','o','win');
            });
            updateStatus();
        }

        function updateScore() {
            document.getElementById('scoreX').textContent = scoreX;
            document.getElementById('scoreO').textContent = scoreO;
        }

        // Sinyal bergabung
        document.querySelector('.secondary[onclick="joinRoom()"]').addEventListener('click', () => {
            if(roomCode) localStorage.setItem('xox_room_' + roomCode, 'joined');
        });
    </script>
</body>
</html>
